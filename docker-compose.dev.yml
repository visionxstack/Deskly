version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deskly-postgres
    environment:
      POSTGRES_DB: deskly
      POSTGRES_USER: deskly_user
      POSTGRES_PASSWORD: deskly_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskly_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: deskly-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: deskly
      DB_USER: deskly_user
      DB_PASSWORD: deskly_password
      JWT_SECRET: change-this-to-a-secure-random-string-in-production
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: deskly-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    command: npm run dev

volumes:
  postgres_data:
